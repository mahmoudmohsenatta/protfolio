name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  nabd-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nabd-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci

  web-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [portfolio, dar-web, nabd-partner]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

